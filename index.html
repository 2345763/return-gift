<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0714" />
  <meta name="description" content="A personal birthday thank-you message made with love." />
  <meta property="og:title" content="A Little Thank You ❤️" />
  <meta property="og:description" content="A personal birthday thank-you message made with love." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="A Little Thank You ❤️" />
  <meta name="twitter:description" content="A personal birthday thank-you message made with love." />
  <title>A Little Thank You ❤️</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop stop-color='%23f472b6'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2360a5fa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect rx='24' width='100' height='100' fill='%230b0714'/%3E%3Cpath d='M50 78 19 48c-10-10-2-28 12-28 8 0 14 4 19 11 5-7 11-11 19-11 14 0 22 18 12 28Z' fill='url(%23g)'/%3E%3C/svg%3E" />

  <style>
    :root{
      --bg:#08060e;
      --bg2:#120b1e;
      --card:rgba(255,255,255,.075);
      --card-strong:rgba(255,255,255,.11);
      --line:rgba(255,255,255,.11);
      --text:#fff;
      --muted:rgba(255,255,255,.67);
      --muted2:rgba(255,255,255,.48);
      --pink:#fb6da8;
      --purple:#8b5cf6;
      --blue:#60a5fa;
      --gold:#f5c86b;
      --green:#61e6a7;
      --shadow:0 20px 60px rgba(0,0,0,.34);
      --radius:28px;
      --ease:cubic-bezier(.2,.8,.2,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      min-height:100svh;
      color:var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(139,92,246,.22), transparent 30%),
        radial-gradient(circle at 85% 18%, rgba(96,165,250,.14), transparent 28%),
        radial-gradient(circle at 52% 85%, rgba(251,109,168,.13), transparent 33%),
        linear-gradient(155deg,var(--bg),var(--bg2) 56%,#090711);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:32px 32px;
      mask-image:linear-gradient(to bottom, black, transparent 85%);
      opacity:.42;
    }

    button,a{font:inherit}
    button{color:inherit}
    a{text-decoration:none;color:inherit}

    .ambient{
      position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
    }
    .orb{
      position:absolute; border-radius:999px; filter:blur(55px); opacity:.35;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .orb.a{width:220px;height:220px;background:var(--purple);left:-70px;top:16vh}
    .orb.b{width:180px;height:180px;background:var(--blue);right:-60px;top:34vh;animation-delay:-5s}
    .orb.c{width:260px;height:260px;background:var(--pink);left:35%;bottom:-120px;animation-delay:-9s}
    @keyframes drift{to{transform:translate3d(24px,-16px,0) scale(1.08)}}

    .app{
      position:relative; z-index:1; min-height:100vh; min-height:100svh;
      display:flex; align-items:center; justify-content:center;
      padding:18px;
    }

    .shell{
      width:min(1040px,100%);
      position:relative;
    }

    .screen{
      display:none;
      animation:screenIn .7s var(--ease) both;
    }
    .screen.active{display:block}
    @keyframes screenIn{
      from{opacity:0;transform:translateY(12px) scale(.985)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    .glass{
      background:linear-gradient(160deg,rgba(255,255,255,.105),rgba(255,255,255,.045));
      border:1px solid var(--line);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(22px) saturate(120%);
      -webkit-backdrop-filter:blur(22px) saturate(120%);
    }

    /* Loading */
    .loader{
      min-height:78svh;
      display:grid; place-items:center; text-align:center;
      border-radius:36px; padding:28px;
    }
    .loader-core{
      width:min(450px,100%);
    }
    .brand-pill{
      display:inline-flex;align-items:center;gap:9px;
      padding:8px 13px; border-radius:999px;
      font-size:12px; letter-spacing:.12em; text-transform:uppercase;
      color:rgba(255,255,255,.72);
      background:rgba(255,255,255,.05);border:1px solid var(--line);
    }
    .heart-mark{
      width:66px;height:66px;margin:24px auto 18px;display:grid;place-items:center;
      border-radius:22px;
      font-size:30px;
      background:linear-gradient(135deg,rgba(251,109,168,.28),rgba(139,92,246,.25),rgba(96,165,250,.18));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 0 50px rgba(251,109,168,.17);
      animation:heartPulse 1.8s ease-in-out infinite;
    }
    @keyframes heartPulse{50%{transform:scale(1.045);box-shadow:0 0 65px rgba(251,109,168,.24)}}
    .loader h1{margin:0;font-size:clamp(30px,7vw,52px);letter-spacing:-.045em;line-height:1.02}
    .loader p{margin:14px auto 0;color:var(--muted);max-width:34ch;font-size:15px;line-height:1.6}
    .progress{
      margin:28px auto 0; width:min(340px,100%); height:9px; border-radius:999px;
      overflow:hidden;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);
    }
    .progress > span{
      display:block;height:100%;width:0;border-radius:inherit;
      background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
      box-shadow:0 0 18px rgba(139,92,246,.6);
      animation:load 1.6s var(--ease) forwards;
    }
    @keyframes load{to{width:100%}}

    /* Selection */
    .selection{padding:8px 0}
    .selection-head{
      text-align:center; padding:20px 8px 28px;
    }
    .eyebrow{
      color:#d7c8ff; font-size:12px; font-weight:700; letter-spacing:.14em;
      text-transform:uppercase;
    }
    .selection h2,.thank h2{
      margin:10px 0 10px;font-size:clamp(34px,8vw,64px);
      letter-spacing:-.055em;line-height:.98;
    }
    .selection-head p{
      margin:0 auto;color:var(--muted);max-width:560px;line-height:1.6;font-size:15px;
    }

    .people{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }
    .person-card{
      position:relative; overflow:hidden; cursor:pointer;
      min-height:138px; text-align:left; border-radius:26px; padding:17px;
      background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.1);
      box-shadow:0 12px 34px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.06);
      transition:transform .25s var(--ease), border-color .25s ease, box-shadow .25s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .person-card::after{
      content:"";position:absolute;inset:-40% -20%;
      background:radial-gradient(circle, var(--accent,rgba(139,92,246,.26)), transparent 62%);
      opacity:.2;pointer-events:none;transition:opacity .25s ease;
    }
    .person-card:hover{
      transform:translateY(-4px);
      border-color:rgba(255,255,255,.19);
      box-shadow:0 18px 44px rgba(0,0,0,.28),0 0 28px var(--glow,rgba(139,92,246,.1));
    }
    .person-card:active{transform:scale(.985) translateY(0)}
    .person-card:focus-visible{outline:2px solid #fff;outline-offset:3px}
    .person-card.selected{
      border-color:rgba(255,255,255,.36);
      box-shadow:0 0 0 1px rgba(255,255,255,.09),0 20px 50px rgba(0,0,0,.3),0 0 44px var(--glow,rgba(139,92,246,.18));
    }
    .person-icon{
      position:relative;z-index:1;width:48px;height:48px;border-radius:17px;
      display:grid;place-items:center;font-size:21px;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    }
    .person-name{position:relative;z-index:1;margin-top:15px;font-size:17px;font-weight:750;letter-spacing:-.02em}
    .person-role{position:relative;z-index:1;margin-top:4px;color:var(--muted2);font-size:12px}
    .chip{
      position:absolute;z-index:2;right:13px;top:13px;
      padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;
      color:rgba(255,255,255,.68);background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);
    }
    .spark{
      position:absolute;right:14px;bottom:13px;z-index:2;font-size:15px;opacity:.74;
      animation:spark 2.6s ease-in-out infinite;
    }
    @keyframes spark{50%{transform:translateY(-4px) rotate(6deg);opacity:1}}

    /* Thank you */
    .thank-wrap{
      border-radius:34px;padding:16px;
    }
    .thank{
      padding:8px;
    }
    .thank-top{
      display:flex;justify-content:space-between;align-items:center;gap:12px;
      margin-bottom:18px;
    }
    .mini-brand{
      display:inline-flex;gap:9px;align-items:center;color:rgba(255,255,255,.62);font-size:12px;
    }
    .mini-dot{
      width:8px;height:8px;border-radius:50%;background:var(--accent,#fb6da8);
      box-shadow:0 0 18px var(--accent,#fb6da8)
    }
    .back-btn{
      border:1px solid var(--line);background:rgba(255,255,255,.05);
      padding:10px 13px;border-radius:13px;cursor:pointer;color:rgba(255,255,255,.85);
      transition:.2s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.09)}
    .hero{
      position:relative;overflow:hidden;
      padding:30px 22px 26px;border-radius:28px;
      background:
        radial-gradient(circle at 20% 10%, color-mix(in srgb, var(--accent,#fb6da8) 22%, transparent), transparent 38%),
        linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.045));
      border:1px solid rgba(255,255,255,.12);
    }
    .hero::before{
      content:"";position:absolute;width:260px;height:260px;right:-150px;top:-160px;border-radius:50%;
      background:radial-gradient(circle,var(--accent,#fb6da8),transparent 67%);opacity:.16;filter:blur(18px)
    }
    .hero-badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:7px 10px;border-radius:999px;font-size:11px;font-weight:700;
      background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.75)
    }
    .hero h2{margin:18px 0 0;font-size:clamp(34px,8vw,58px)}
    .hero .message{
      max-width:740px;margin:18px 0 0;color:rgba(255,255,255,.78);
      font-size:clamp(16px,2.8vw,20px);line-height:1.72;
    }
    .signature{
      margin-top:18px;color:rgba(255,255,255,.5);font-size:12px;
    }

    .love-note,.whatsapp,.footer{
      margin-top:14px; border-radius:26px; padding:22px;
    }
    .section-label{
      display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em
    }
    .section-label .icon{
      width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)
    }
    .note-text{
      margin:14px 0 0;color:var(--muted);line-height:1.8;font-size:15px;
    }
    .note-text p{margin:0 0 9px}.note-text p:last-child{margin-bottom:0}
    .whatsapp{
      display:flex;flex-direction:column;gap:16px;
      background:linear-gradient(150deg,rgba(97,230,167,.09),rgba(255,255,255,.045));
    }
    .wa-copy h3{margin:0;font-size:22px;letter-spacing:-.03em}
    .wa-copy p{margin:7px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
    .wa-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      min-height:54px;padding:14px 16px;border-radius:17px;
      background:linear-gradient(135deg,#25d366,#18b953);
      color:#06140d;font-weight:850;
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 10px 30px rgba(37,211,102,.22), inset 0 1px 0 rgba(255,255,255,.3);
      transition:transform .18s ease,filter .18s ease;
    }
    .wa-btn:hover{transform:translateY(-2px);filter:saturate(1.08)}
    .wa-btn:active{transform:scale(.985)}
    .wa-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
    .wa-icon{
      width:22px;height:22px;border-radius:8px;display:grid;place-items:center;
      background:rgba(0,0,0,.09);font-size:13px
    }
    .footer{text-align:center;padding:18px;color:rgba(255,255,255,.5);font-size:12px;line-height:1.7}
    .footer strong{color:rgba(255,255,255,.78)}

    .particle,.float-heart,.paw{
      position:fixed;pointer-events:none;z-index:10;
      will-change:transform,opacity;
    }
    .particle{
      width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.65);
      box-shadow:0 0 10px rgba(255,255,255,.45)
    }
    .float-heart{font-size:15px;opacity:0;animation:floatUp 1.4s ease-out forwards}
    @keyframes floatUp{
      0%{opacity:0;transform:translate3d(0,8px,0) scale(.8)}
      18%{opacity:1}
      100%{opacity:0;transform:translate3d(var(--dx),-90px,0) scale(1.2) rotate(14deg)}
    }
    .paw{font-size:16px;opacity:0;animation:pawFloat 1.5s ease-out forwards}
    @keyframes pawFloat{
      0%{opacity:0;transform:translateY(14px) rotate(-12deg)}
      15%{opacity:.85}
      100%{opacity:0;transform:translateY(-76px) rotate(17deg)}
    }

    .tiny-hint{
      text-align:center;color:var(--muted2);font-size:11px;margin-top:16px;
    }

    /* Desktop */
    @media (min-width:700px){
      .app{padding:30px}
      .people{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
      .person-card{min-height:155px;padding:19px}
      .thank-wrap{padding:22px}
      .thank{padding:10px}
      .hero{padding:42px 38px 36px}
      .love-note,.whatsapp{padding:26px}
      .whatsapp{flex-direction:row;align-items:center;justify-content:space-between}
      .wa-btn{min-width:260px}
      .selection-head{padding:28px 8px 34px}
    }

    @media (min-width:980px){
      .selection-head{text-align:left;display:flex;align-items:end;justify-content:space-between;gap:36px}
      .selection-head p{margin:0;max-width:430px;text-align:right}
    }

    /* Very small screens */
    @media (max-width:340px){
      .app{padding:10px}
      .people{gap:8px}
      .person-card{padding:13px;min-height:126px;border-radius:22px}
      .person-name{font-size:15px}
      .chip{display:none}
      .hero{padding:24px 18px 22px}
      .hero h2{font-size:31px}
      .love-note,.whatsapp,.footer{padding:18px;border-radius:22px}
    }

    @media (prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  </div>

  <main class="app">
    <div class="shell">

      <!-- LOADING -->
      <section class="screen active" id="loading" aria-label="Loading">
        <div class="loader glass">
          <div class="loader-core">
            <div class="brand-pill">✦ A little birthday surprise</div>
            <div class="heart-mark" aria-hidden="true">❤️</div>
            <h1>Loading a little<br/>birthday surprise…</h1>
            <p id="loadingCaption">Something personal is waiting for you.</p>
            <div class="progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
              <span></span>
            </div>
            <div class="tiny-hint">Made with love ❤️</div>
          </div>
        </div>
      </section>

      <!-- SELECT -->
      <section class="screen" id="selection" aria-label="Person selection">
        <div class="selection">
          <div class="selection-head">
            <div>
              <div class="eyebrow">Personal birthday thank-you</div>
              <h2>Who sent you<br/>birthday wishes?</h2>
            </div>
            <p>Choose your name and unlock your personal thank-you message ❤️</p>
          </div>

          <div class="people" id="peopleGrid"></div>
          <div class="tiny-hint">Tap a card to open your personal message.</div>
        </div>
      </section>

      <!-- THANK YOU -->
      <section class="screen" id="thankScreen" aria-label="Personal thank-you">
        <div class="thank-wrap glass">
          <div class="thank" id="thankContent"></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const PEOPLE = {
      arav: {
        name: "Arav Bhaiya",
        role: "Family • Always there",
        icon: "✦",
        badge: "For you",
        accent: "#60a5fa",
        glow: "rgba(96,165,250,.18)",
        theme: "Elegant masculine premium styling",
        message: "Thank you so much for wishing me on my birthday, Arav Bhaiya. Your wishes genuinely made my day more special. I’m really grateful for your love, support, and the warmth you always give me. Having someone like you in my life means a lot to me. ❤️"
      },
      rubaina: {
        name: "Rubaina Didi",
        role: "Family • Sweet soul",
        icon: "❀",
        badge: "With love",
        accent: "#f472b6",
        glow: "rgba(244,114,182,.18)",
        theme: "Soft elegant floral & heart-inspired accents",
        message: "Thank you so much for the lovely birthday wishes, Rubaina Didi. Your message honestly made my birthday even more special. I’m really lucky to have your love, care, and support. Thank you for always being so wonderful and making moments like these memorable. ❤️"
      },
      badi: {
        name: "Badi Mumma",
        role: "Family • Warm heart",
        icon: "✧",
        badge: "Blessings",
        accent: "#f5c86b",
        glow: "rgba(245,200,107,.19)",
        theme: "Warm golden family-style glow",
        message: "Thank you so much for wishing me on my birthday, Badi Mumma. Your blessings, love, and wishes mean more to me than I can explain. Your warmth and affection always make me feel special. I’m truly grateful to have you in my life. ❤️"
      },
      mumma: {
        name: "Mumma",
        role: "My biggest blessing",
        icon: "♥",
        badge: "With all my love",
        accent: "#fb6da8",
        glow: "rgba(251,109,168,.28)",
        theme: "Warm pink/red heart glow",
        message: "Thank you so much, Mumma, for your birthday wishes and for everything you do for me. Your love, support, blessings, and care mean the world to me. No matter how much I say, it will never be enough to describe how important you are to me. I love you so much. ❤️"
      },
      dadi: {
        name: "Dadi",
        role: "Family • Precious blessings",
        icon: "☼",
        badge: "Blessings",
        accent: "#f6d58b",
        glow: "rgba(246,213,139,.18)",
        theme: "Warm gold & blessing-inspired elegance",
        message: "Thank you so much for your beautiful birthday wishes, Dadi. Your blessings and love are incredibly precious to me. Knowing that you are always there with your affection and blessings makes me feel truly lucky. Thank you for making my birthday more special. ❤️"
      },
      viaan: {
        name: "Viaan",
        role: "Best little buddy 🐶",
        icon: "🐾",
        badge: "Paws only",
        accent: "#a78bfa",
        glow: "rgba(167,139,250,.2)",
        theme: "Cute dog/paw animations",
        message: "Thank you so much for your birthday wishes, Viaan! I know you may not be able to write a message, but your cute face, tail wags, and love are more than enough. You made my special day even happier just by being you. Big hugs and lots of love for my little buddy! 🐶❤️"
      }
    };

    const LOVE_NOTE = `Your birthday wish may have been just a message, but to me it was a little reminder of how lucky I am to have wonderful people around me.`;

    const loading = document.getElementById("loading");
    const selection = document.getElementById("selection");
    const thankScreen = document.getElementById("thankScreen");
    const grid = document.getElementById("peopleGrid");
    const thankContent = document.getElementById("thankContent");
    const progress = document.querySelector(".progress > span");
    const loadingCaption = document.getElementById("loadingCaption");

    function showScreen(el) {
      [loading, selection, thankScreen].forEach(s => s.classList.remove("active"));
      el.classList.add("active");
    }

    function spawnParticles(count = 15) {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;
      for(let i=0;i<count;i++){
        const p = document.createElement("span");
        p.className = "particle";
        p.style.left = (10 + Math.random()*80) + "vw";
        p.style.top = (15 + Math.random()*70) + "vh";
        p.style.opacity = (.15 + Math.random()*.55).toFixed(2);
        p.style.transform = `translateY(${8 + Math.random()*14}px)`;
        p.animate(
          [{transform:"translateY(16px) scale(.5)",opacity:0},
           {transform:"translateY(0) scale(1)",opacity:.8,offset:.45},
           {transform:"translateY(-34px) scale(.8)",opacity:0}],
          {duration:1800+Math.random()*1600,delay:Math.random()*900,easing:"ease-out"}
        );
        document.body.appendChild(p);
        setTimeout(()=>p.remove(), 4200);
      }
    }

    function floatingLove(x, y, type = "heart") {
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce) return;
      const el = document.createElement("span");
      el.className = type === "paw" ? "paw" : "float-heart";
      el.textContent = type === "paw" ? "🐾" : "♥";
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      el.style.setProperty("--dx", `${(Math.random()*100-50)}px`);
      if(type === "paw") el.style.setProperty("--dx", `${(Math.random()*60-30)}px`);
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1600);
    }

    function renderPeople() {
      grid.innerHTML = Object.entries(PEOPLE).map(([id,p]) => `
        <button class="person-card"
          type="button"
          data-person="${id}"
          style="--accent:${p.accent};--glow:${p.glow};"
          aria-label="Open thank-you message for ${p.name}">
          <span class="chip">${p.badge}</span>
          <span class="person-icon" aria-hidden="true">${p.icon}</span>
          <div class="person-name">${p.name}</div>
          <div class="person-role">${p.role}</div>
          <span class="spark" aria-hidden="true">✦</span>
        </button>
      `).join("");

      grid.querySelectorAll(".person-card").forEach(card => {
        card.addEventListener("click", e => {
          grid.querySelectorAll(".person-card").forEach(c => c.classList.remove("selected"));
          card.classList.add("selected");
          const rect = card.getBoundingClientRect();
          const cx = rect.left + rect.width/2;
          const cy = rect.top + 45;

          const id = card.dataset.person;
          if(id === "viaan"){
            floatingLove(cx,cy,"paw");
            floatingLove(cx+16,cy+3,"paw");
            floatingLove(cx-16,cy+7,"paw");
          } else {
            floatingLove(cx,cy,"heart");
            floatingLove(cx+18,cy+6,"heart");
          }

          setTimeout(() => renderThankYou(id), 420);
        });
      });
    }

    function renderThankYou(id) {
      const p = PEOPLE[id];
      document.documentElement.style.setProperty("--accent", p.accent);
      document.documentElement.style.setProperty("--glow", p.glow);

      thankContent.innerHTML = `
        <div class="thank-top">
          <div class="mini-brand">
            <span class="mini-dot" style="background:${p.accent};box-shadow:0 0 18px ${p.accent}"></span>
            A little thank-you, made personally
          </div>
          <button class="back-btn" type="button" id="backBtn">← Choose another person</button>
        </div>

        <div class="hero" style="--accent:${p.accent}">
          <div class="hero-badge">${p.icon} ${p.theme}</div>
          <h2>Thank you so much,<br/>${p.name}! ❤️</h2>
          <div class="message">${p.message}</div>
          <div class="signature">Your wish made my birthday a little brighter.</div>
        </div>

        <div class="love-note glass">
          <div class="section-label">
            <span class="icon">💌</span>
            <span>A Little Love Note</span>
          </div>
          <div class="note-text">
            <p>${LOVE_NOTE}</p>
            <p>Thank you for thinking of me, remembering my birthday, and taking a moment to make me smile.</p>
            <p><strong>Lots of love ❤️</strong></p>
          </div>
        </div>

        <div class="whatsapp glass">
          <div class="wa-copy">
            <h3>Want to reply to me? 💬</h3>
            <p>You can always message me on WhatsApp ❤️</p>
          </div>
          <a
            class="wa-btn"
            href="https://wa.me/917042145705?text=Hey%21%20Thank%20you%20for%20the%20birthday%20wishes%20%E2%9D%A4%EF%B8%8F"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Message me on WhatsApp">
            <span class="wa-icon">↗</span>
            Message Me on WhatsApp
          </a>
        </div>

        <div class="footer glass">
          <strong>Made with ❤️ as a little thank-you.</strong><br/>
          Thank you for being part of my special day.
        </div>
      `;

      showScreen(thankScreen);
      document.getElementById("backBtn").addEventListener("click", () => {
        showScreen(selection);
        window.scrollTo({top:0,behavior:"smooth"});
        spawnParticles(8);
      });

      window.scrollTo({top:0,behavior:"smooth"});

      if(id === "viaan") {
        setTimeout(() => {
          const rect = document.querySelector(".hero").getBoundingClientRect();
          for(let i=0;i<5;i++){
            setTimeout(() => floatingLove(rect.left + rect.width*(.2 + Math.random()*.6), rect.top + rect.height*.22, "paw"), i*100);
          }
        }, 250);
      } else {
        setTimeout(() => {
          const rect = document.querySelector(".hero").getBoundingClientRect();
          for(let i=0;i<7;i++){
            setTimeout(() => floatingLove(rect.left + rect.width*(.15 + Math.random()*.7), rect.top + rect.height*.26, "heart"), i*90);
          }
        }, 250);
      }
    }

    renderPeople();
    spawnParticles(18);

    // Premium 1–2 second welcome transition
    setTimeout(() => {
      loadingCaption.textContent = "Made with love ❤️";
    }, 700);

    setTimeout(() => {
      showScreen(selection);
      spawnParticles(22);
    }, 1700);
  </script>
</body>
</html>
